<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>埋見家 家計簿</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root {
    --primary: #1B5E3B;
    --primary-mid: #2E7D55;
    --primary-light: #E8F5EE;
    --primary-pale: #F2FAF5;
    --accent: #D84E1F;
    --accent-light: #FDEEE8;
    --gold: #B8860B;
    --gold-light: #FFF8E1;
    --text: #1A1A1A;
    --text-mid: #555;
    --text-muted: #888;
    --border: rgba(0,0,0,0.1);
    --border-mid: rgba(0,0,0,0.15);
    --surface: #F7F7F5;
    --card: #FFFFFF;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
    background: var(--surface);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── Header ─── */
  .app-header {
    background: var(--primary);
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.2);
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px 10px;
  }
  .app-title {
    font-size: 18px;
    font-weight: 700;
    color: white;
    letter-spacing: 0.03em;
  }
  .month-nav {
    display: flex;
    align-items: center;
    gap: 10px;
    color: white;
  }
  .month-nav button {
    background: rgba(255,255,255,0.18);
    border: none;
    color: white;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .month-nav button:hover { background: rgba(255,255,255,0.3); }
  .month-label { font-size: 14px; font-weight: 500; min-width: 80px; text-align: center; }

  .user-tabs {
    display: flex;
    padding: 0 18px;
  }
  .user-tab {
    flex: 1;
    padding: 8px 0;
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border-bottom: 2.5px solid transparent;
    color: rgba(255,255,255,0.6);
    transition: all 0.2s;
    letter-spacing: 0.04em;
  }
  .user-tab.active {
    color: white;
    border-bottom-color: #7FFFC4;
  }

  /* ─── Bottom Nav ─── */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    background: var(--card);
    border-top: 0.5px solid var(--border);
    display: flex;
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom, 0);
    box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
  }
  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0 8px;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 11px;
    gap: 4px;
    transition: color 0.15s;
    border: none;
    background: none;
  }
  .nav-btn.active { color: var(--primary); }
  .nav-btn svg { width: 22px; height: 22px; }

  /* ─── Pages ─── */
  .page { display: none; padding: 16px 16px 90px; max-width: 480px; margin: 0 auto; }
  .page.active { display: block; }

  /* ─── Summary Cards ─── */
  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .summary-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    border: 0.5px solid var(--border);
  }
  .summary-card.full { grid-column: 1 / -1; }
  .summary-label {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .summary-amount {
    font-size: 22px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: -0.02em;
  }
  .summary-amount.small { font-size: 18px; }
  .summary-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* ─── Category Breakdown ─── */
  .section-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .cat-bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .cat-bar-label { width: 52px; color: var(--text-mid); flex-shrink: 0; font-size: 12px; }
  .cat-bar-track { flex: 1; height: 6px; background: #eee; border-radius: 3px; overflow: hidden; }
  .cat-bar-fill { height: 100%; border-radius: 3px; background: var(--primary-mid); transition: width 0.4s ease; }
  .cat-bar-amount { min-width: 60px; text-align: right; color: var(--text-mid); font-size: 12px; }

  /* ─── Entry List ─── */
  .entry-list { display: flex; flex-direction: column; gap: 8px; }
  .entry-card {
    background: var(--card);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow);
    border: 0.5px solid var(--border);
  }
  .entry-dot {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: var(--primary-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .entry-info { flex: 1; min-width: 0; }
  .entry-name { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry-meta { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .entry-right { text-align: right; flex-shrink: 0; }
  .entry-amount { font-size: 15px; font-weight: 700; color: var(--primary); }
  .entry-cat-pill {
    display: inline-block;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 10px;
    background: var(--primary-light);
    color: var(--primary-mid);
    font-weight: 500;
    margin-top: 2px;
  }
  .entry-cat-pill.leisure { background: var(--gold-light); color: var(--gold); }
  .entry-cat-pill.medical { background: #FFF0F0; color: #C0392B; }

  /* ─── Add Entry Page ─── */
  .receipt-zone {
    background: var(--card);
    border: 2px dashed var(--primary-mid);
    border-radius: var(--radius);
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .receipt-zone:hover { background: var(--primary-pale); }
  .receipt-zone.scanning { border-color: var(--accent); background: var(--accent-light); }
  .receipt-zone.done { border-color: var(--primary); background: var(--primary-pale); border-style: solid; }
  .receipt-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .receipt-icon { font-size: 32px; margin-bottom: 8px; }
  .receipt-main-text { font-size: 15px; font-weight: 500; color: var(--primary); }
  .receipt-sub-text { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .scanning-anim { display: none; }
  .receipt-zone.scanning .scanning-anim { display: block; }
  .receipt-zone.scanning .receipt-default { display: none; }
  @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
  .scanning-text { animation: pulse 1s infinite; color: var(--accent); font-weight: 500; font-size: 14px; }

  .form-section {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
    border: 0.5px solid var(--border);
  }
  .form-row { margin-bottom: 14px; }
  .form-row:last-child { margin-bottom: 0; }
  .form-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    margin-bottom: 6px;
    display: block;
  }
  .form-input {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--border-mid);
    border-radius: var(--radius-sm);
    font-size: 15px;
    color: var(--text);
    background: var(--surface);
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    -webkit-appearance: none;
  }
  .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(27,94,59,0.1); background: white; }
  .amount-row { display: flex; align-items: center; gap: 6px; }
  .yen { font-size: 20px; color: var(--text-muted); font-weight: 500; }
  .amount-input { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; flex: 1; }

  .cat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
  }
  .cat-btn {
    padding: 9px 4px;
    border: 1px solid var(--border-mid);
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 500;
    text-align: center;
    cursor: pointer;
    background: var(--surface);
    color: var(--text-mid);
    transition: all 0.15s;
    font-family: inherit;
  }
  .cat-btn:hover { background: var(--primary-light); border-color: var(--primary-mid); color: var(--primary); }
  .cat-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
    font-weight: 700;
  }

  .who-grid { display: flex; gap: 8px; }
  .who-btn {
    flex: 1; padding: 10px 4px;
    border: 1px solid var(--border-mid);
    border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 500;
    text-align: center; cursor: pointer;
    background: var(--surface); color: var(--text-mid);
    transition: all 0.15s; font-family: inherit;
  }
  .who-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

  .kikae-grid { display: flex; gap: 8px; }
  .kikae-btn {
    flex: 1; padding: 9px 4px;
    border: 1px solid var(--border-mid);
    border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 500;
    text-align: center; cursor: pointer;
    background: var(--surface); color: var(--text-mid);
    transition: all 0.15s; font-family: inherit;
  }
  .kikae-btn.active { background: var(--gold); border-color: var(--gold); color: white; }

  .save-btn {
    width: 100%;
    padding: 16px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.04em;
    transition: all 0.15s;
    box-shadow: 0 4px 16px rgba(27,94,59,0.3);
  }
  .save-btn:hover { background: var(--primary-mid); }
  .save-btn:active { transform: scale(0.98); }

  /* ─── History Page ─── */
  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .filter-chip {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border-mid);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    background: var(--card);
    color: var(--text-mid);
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .filter-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* ─── Toast ─── */
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1A1A1A;
    color: white;
    padding: 12px 22px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: var(--shadow-lg);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ─── AI Result highlight ─── */
  .ai-fill { border-color: var(--primary) !important; background: var(--primary-pale) !important; box-shadow: 0 0 0 3px rgba(27,94,59,0.15) !important; }

  /* Spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { width: 20px; height: 20px; border: 2.5px solid rgba(255,255,255,0.3); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; vertical-align: middle; }

  /* Subtle divider */
  .divider { height: 1px; background: var(--border); margin: 14px 0; }

  .page-spacer { height: 16px; }

  /* Fixed costs badge */
  .fixed-badge {
    display: inline-block; font-size: 10px; background: var(--gold-light);
    color: var(--gold); padding: 2px 7px; border-radius: 10px; font-weight: 500; margin-left: 6px;
  }

  /* Shimmer loading skeleton */
  @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
  .skeleton {
    border-radius: 6px; height: 16px;
    background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
    background-size: 800px 100%;
    animation: shimmer 1.2s infinite;
  }

  /* ─── Stats Page ─── */
  .chart-container { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .chart-title { font-size: 13px; font-weight: 700; color: var(--text-mid); margin-bottom: 14px; }
  .bar-chart { display: flex; flex-direction: column; gap: 10px; }

</style>
</head>
<body>

<div class="app-header">
  <div class="header-top">
    <div class="app-title">埋見家 家計簿</div>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">&#8249;</button>
      <span class="month-label" id="month-label">—</span>
      <button onclick="changeMonth(1)">&#8250;</button>
    </div>
  </div>
  <div class="user-tabs">
    <div class="user-tab active" data-user="全員" onclick="setUser(this)">全員</div>
    <div class="user-tab" data-user="啓史" onclick="setUser(this)">啓史</div>
    <div class="user-tab" data-user="泉" onclick="setUser(this)">泉</div>
  </div>
</div>

<!-- HOME PAGE -->
<div class="page active" id="page-home">
  <div class="page-spacer"></div>

  <div class="summary-grid">
    <div class="summary-card full">
      <div class="summary-label">TODAY 今月の合計支出</div>
      <div class="summary-amount" id="total-amount">¥0</div>
      <div class="summary-sub" id="total-sub">0件の記録</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">食費</div>
      <div class="summary-amount small" id="stat-食費">¥0</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">日用品</div>
      <div class="summary-amount small" id="stat-日用品">¥0</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">レジャー</div>
      <div class="summary-amount small" id="stat-レジャー">¥0</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">医療費</div>
      <div class="summary-amount small" id="stat-医療費">¥0</div>
    </div>
  </div>

  <div class="section-title">カテゴリ別</div>
  <div class="chart-container">
    <div class="bar-chart" id="cat-bars"></div>
  </div>

  <div class="section-title">最近の記録</div>
  <div class="entry-list" id="recent-entries"></div>
</div>

<!-- ADD PAGE -->
<div class="page" id="page-add">
  <div class="page-spacer"></div>

  <div class="receipt-zone" id="receipt-zone">
    <input type="file" accept="image/*" capture="environment" onchange="scanReceipt(this)" id="receipt-input">
    <div class="receipt-default">
      <div class="receipt-icon">📷</div>
      <div class="receipt-main-text">レシートを撮影 / 選択</div>
      <div class="receipt-sub-text">写真からAIが自動で読み取ります</div>
    </div>
    <div class="scanning-anim">
      <div style="font-size:28px;margin-bottom:8px;">🤖</div>
      <div class="scanning-text">AIが読み取り中...</div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:6px;">店名・金額・カテゴリを自動判定</div>
    </div>
  </div>

  <div class="form-section">
    <div class="form-row">
      <label class="form-label">備考（店名・内容）</label>
      <input class="form-input" id="f-memo" type="text" placeholder="例：トライアル、コスモス、歯科…">
    </div>
    <div class="form-row">
      <label class="form-label">金額</label>
      <div class="amount-row">
        <span class="yen">¥</span>
        <input class="form-input amount-input" id="f-amount" type="number" inputmode="numeric" placeholder="0">
      </div>
    </div>
  </div>

  <div class="form-section">
    <div class="form-row">
      <label class="form-label">カテゴリ</label>
      <div class="cat-grid" id="cat-grid">
        <button class="cat-btn active" onclick="selectCat(this)">食費</button>
        <button class="cat-btn" onclick="selectCat(this)">日用品</button>
        <button class="cat-btn" onclick="selectCat(this)">交通費</button>
        <button class="cat-btn" onclick="selectCat(this)">教育費</button>
        <button class="cat-btn" onclick="selectCat(this)">交際費</button>
        <button class="cat-btn" onclick="selectCat(this)">公租公課</button>
        <button class="cat-btn" onclick="selectCat(this)">保険</button>
        <button class="cat-btn" onclick="selectCat(this)">レジャー</button>
        <button class="cat-btn" onclick="selectCat(this)">通信費</button>
        <button class="cat-btn" onclick="selectCat(this)">光熱費</button>
        <button class="cat-btn" onclick="selectCat(this)">医療費</button>
        <button class="cat-btn" onclick="selectCat(this)">その他</button>
      </div>
    </div>

    <div class="form-row">
      <label class="form-label">入力者</label>
      <div class="who-grid">
        <button class="who-btn active" onclick="selectWho(this)">啓史</button>
        <button class="who-btn" onclick="selectWho(this)">泉</button>
      </div>
    </div>

    <div class="form-row">
      <label class="form-label">立替払い（任意）</label>
      <div class="kikae-grid">
        <button class="kikae-btn active" onclick="selectKikae(this)">なし</button>
        <button class="kikae-btn" onclick="selectKikae(this)">啓史立替</button>
        <button class="kikae-btn" onclick="selectKikae(this)">泉立替</button>
      </div>
    </div>

    <div class="form-row">
      <label class="form-label">日付</label>
      <input class="form-input" id="f-date" type="date">
    </div>
  </div>

  <button class="save-btn" onclick="saveEntry()">記録する</button>
</div>

<!-- HISTORY PAGE -->
<div class="page" id="page-history">
  <div class="page-spacer"></div>
  <div class="filter-bar" id="filter-bar">
    <div class="filter-chip active" data-cat="全て" onclick="setFilter(this)">全て</div>
    <div class="filter-chip" data-cat="食費" onclick="setFilter(this)">食費</div>
    <div class="filter-chip" data-cat="日用品" onclick="setFilter(this)">日用品</div>
    <div class="filter-chip" data-cat="レジャー" onclick="setFilter(this)">レジャー</div>
    <div class="filter-chip" data-cat="医療費" onclick="setFilter(this)">医療費</div>
    <div class="filter-chip" data-cat="教育費" onclick="setFilter(this)">教育費</div>
    <div class="filter-chip" data-cat="交通費" onclick="setFilter(this)">交通費</div>
    <div class="filter-chip" data-cat="その他" onclick="setFilter(this)">その他</div>
  </div>
  <div class="entry-list" id="history-entries"></div>
</div>

<!-- STATS PAGE -->
<div class="page" id="page-stats">
  <div class="page-spacer"></div>

  <div class="summary-grid">
    <div class="summary-card full">
      <div class="summary-label">月間合計</div>
      <div class="summary-amount" id="stats-total">¥0</div>
      <div class="summary-sub" id="stats-sub">0件</div>
    </div>
  </div>

  <div class="chart-container">
    <div class="chart-title">カテゴリ別内訳</div>
    <div class="bar-chart" id="stats-bars"></div>
  </div>

  <div class="chart-container">
    <div class="chart-title">立替払い残高</div>
    <div id="kikae-stats"></div>
  </div>

  <div class="chart-container">
    <div class="chart-title">固定費</div>
    <div id="fixed-costs-list"></div>
  </div>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <button class="nav-btn active" onclick="showPage('home', this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    ホーム
  </button>
  <button class="nav-btn" onclick="showPage('add', this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    入力
  </button>
  <button class="nav-btn" onclick="showPage('history', this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    履歴
  </button>
  <button class="nav-btn" onclick="showPage('stats', this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    統計
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
// ─── State ───
let currentUser = '全員';
let currentFilter = '全て';
let currentMonth = new Date();
currentMonth.setDate(1);
let entries = [];

// ─── Category icons & colors ───
const CAT_ICON = {
  '食費':'🛒','日用品':'🧴','交通費':'🚗','教育費':'📚',
  '交際費':'🎁','公租公課':'🏛','保険':'🛡','レジャー':'🎡',
  '通信費':'📱','光熱費':'💡','医療費':'🏥','その他':'📌'
};
const CAT_COLOR = {
  '食費':'#2E7D55','日用品':'#1565C0','交通費':'#6A1B9A','教育費':'#E65100',
  '交際費':'#AD1457','公租公課':'#4E342E','保険':'#00695C','レジャー':'#F57F17',
  '通信費':'#37474F','光熱費':'#558B2F','医療費':'#C62828','その他':'#546E7A'
};

// ─── Fixed costs from the actual spreadsheet ───
const FIXED_COSTS = [
  { name: '電気代', amount: 0 },
  { name: '水道代', amount: 7748 },
  { name: '泉 医療保険', amount: 2140 },
  { name: '泉 がん保険', amount: 2448 },
  { name: '啓史 スマホ', amount: 1880 },
  { name: '泉 スマホ', amount: 941 },
  { name: '自宅 Wi-Fi', amount: 5280 },
  { name: '咲良 ダンス月謝', amount: 4950 },
];

// ─── Load / Save ───
function loadEntries() {
  try {
    const raw = localStorage.getItem('umeimi_entries_v2');
    entries = raw ? JSON.parse(raw) : getSampleData();
  } catch(e) { entries = getSampleData(); }
}
function saveEntries() {
  localStorage.setItem('umeimi_entries_v2', JSON.stringify(entries));
}

function getSampleData() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth()+1;
  const d = (day) => `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  return [
    { id:1, date: d(1), memo:'プラッツ', amount:3650, cat:'食費', who:'啓史', kikae:'なし' },
    { id:2, date: d(2), memo:'ラムー', amount:2040, cat:'食費', who:'泉', kikae:'なし' },
    { id:3, date: d(2), memo:'西松屋', amount:2295, cat:'日用品', who:'泉', kikae:'なし' },
    { id:4, date: d(4), memo:'イオン', amount:5800, cat:'食費', who:'啓史', kikae:'なし' },
    { id:5, date: d(7), memo:'ダイレックス', amount:1498, cat:'日用品', who:'泉', kikae:'なし' },
    { id:6, date: d(10), memo:'ペガサス石油', amount:3229, cat:'交通費', who:'啓史', kikae:'なし' },
    { id:7, date: d(12), memo:'のざき小児歯科', amount:330, cat:'医療費', who:'泉', kikae:'なし' },
    { id:8, date: d(15), memo:'しいのみこども園', amount:10950, cat:'教育費', who:'啓史', kikae:'なし' },
  ];
}

// ─── Filtering ───
function getFilteredEntries() {
  const y = currentMonth.getFullYear();
  const m = currentMonth.getMonth();
  return entries.filter(e => {
    const ed = new Date(e.date);
    if (ed.getFullYear() !== y || ed.getMonth() !== m) return false;
    if (currentUser !== '全員' && e.who !== currentUser) return false;
    if (currentFilter !== '全て' && e.cat !== currentFilter) return false;
    return true;
  });
}

// ─── Render ───
function renderHome() {
  const fe = getFilteredEntries();
  const total = fe.reduce((s,e) => s+e.amount, 0);
  document.getElementById('total-amount').textContent = '¥' + total.toLocaleString();
  document.getElementById('total-sub').textContent = fe.length + '件の記録';

  const cats = ['食費','日用品','レジャー','医療費'];
  cats.forEach(cat => {
    const sum = fe.filter(e=>e.cat===cat).reduce((s,e)=>s+e.amount,0);
    const el = document.getElementById('stat-' + cat);
    if (el) el.textContent = '¥' + sum.toLocaleString();
  });

  // cat bars
  const catTotals = {};
  fe.forEach(e => { catTotals[e.cat] = (catTotals[e.cat]||0) + e.amount; });
  const maxVal = Math.max(...Object.values(catTotals), 1);
  const sorted = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const bars = document.getElementById('cat-bars');
  bars.innerHTML = sorted.map(([cat, amt]) => `
    <div class="cat-bar-row">
      <div class="cat-bar-label">${cat}</div>
      <div class="cat-bar-track">
        <div class="cat-bar-fill" style="width:${Math.round(amt/maxVal*100)}%;background:${CAT_COLOR[cat]||'var(--primary-mid)'}"></div>
      </div>
      <div class="cat-bar-amount">¥${amt.toLocaleString()}</div>
    </div>
  `).join('') || '<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:12px">まだ記録がありません</div>';

  // recent entries (last 6)
  const recent = [...fe].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,6);
  const list = document.getElementById('recent-entries');
  list.innerHTML = recent.length ? recent.map(e => entryHTML(e)).join('') :
    '<div class="empty-state"><div class="icon">📝</div><p>今月はまだ記録がありません</p></div>';
}

function renderHistory() {
  const fe = getFilteredEntries();
  const sorted = [...fe].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const list = document.getElementById('history-entries');
  list.innerHTML = sorted.length ? sorted.map(e => entryHTML(e, true)).join('') :
    '<div class="empty-state"><div class="icon">📋</div><p>条件に合う記録がありません</p></div>';
}

function renderStats() {
  const fe = entries.filter(e => {
    const ed = new Date(e.date);
    return ed.getFullYear()===currentMonth.getFullYear() && ed.getMonth()===currentMonth.getMonth();
  });
  const total = fe.reduce((s,e)=>s+e.amount,0);
  document.getElementById('stats-total').textContent = '¥'+total.toLocaleString();
  document.getElementById('stats-sub').textContent = fe.length+'件';

  const catTotals = {};
  fe.forEach(e => { catTotals[e.cat] = (catTotals[e.cat]||0) + e.amount; });
  const maxVal = Math.max(...Object.values(catTotals),1);
  const sorted = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  document.getElementById('stats-bars').innerHTML = sorted.map(([cat,amt]) => `
    <div class="cat-bar-row">
      <div class="cat-bar-label">${cat}</div>
      <div class="cat-bar-track">
        <div class="cat-bar-fill" style="width:${Math.round(amt/maxVal*100)}%;background:${CAT_COLOR[cat]||'var(--primary-mid)'}"></div>
      </div>
      <div class="cat-bar-amount">¥${amt.toLocaleString()}</div>
    </div>
  `).join('') || '<div style="font-size:13px;color:var(--text-muted)">データなし</div>';

  // kikae
  const kikaeH = fe.filter(e=>e.kikae==='啓史立替').reduce((s,e)=>s+e.amount,0);
  const kikaeI = fe.filter(e=>e.kikae==='泉立替').reduce((s,e)=>s+e.amount,0);
  document.getElementById('kikae-stats').innerHTML = `
    <div class="cat-bar-row"><div class="cat-bar-label" style="width:80px">啓史立替</div><div class="cat-bar-amount" style="color:var(--accent)">¥${kikaeH.toLocaleString()}</div></div>
    <div class="cat-bar-row"><div class="cat-bar-label" style="width:80px">泉 立替</div><div class="cat-bar-amount" style="color:var(--accent)">¥${kikaeI.toLocaleString()}</div></div>
  `;

  // fixed costs
  document.getElementById('fixed-costs-list').innerHTML = FIXED_COSTS.map(fc => `
    <div class="cat-bar-row">
      <div class="cat-bar-label" style="width:120px;font-size:12px">${fc.name}</div>
      <div class="cat-bar-amount">${fc.amount ? '¥'+fc.amount.toLocaleString() : '—'}</div>
    </div>
  `).join('');
}

function entryHTML(e, showDelete=false) {
  const d = new Date(e.date);
  const dateStr = `${d.getMonth()+1}月${d.getDate()}日`;
  const icon = CAT_ICON[e.cat] || '📌';
  const kikaeNote = e.kikae !== 'なし' ? ` ・ <span style="color:var(--gold)">${e.kikae}</span>` : '';
  return `
    <div class="entry-card" id="entry-${e.id}">
      <div class="entry-dot">${icon}</div>
      <div class="entry-info">
        <div class="entry-name">${e.memo}</div>
        <div class="entry-meta">${dateStr} ・ ${e.who}${kikaeNote}</div>
        <span class="entry-cat-pill ${e.cat==='レジャー'?'leisure':''} ${e.cat==='医療費'?'medical':''}">${e.cat}</span>
      </div>
      <div class="entry-right">
        <div class="entry-amount">¥${e.amount.toLocaleString()}</div>
        ${showDelete ? `<div style="font-size:11px;color:var(--text-muted);cursor:pointer;margin-top:4px;text-align:right" onclick="deleteEntry(${e.id})">削除</div>` : ''}
      </div>
    </div>
  `;
}

// ─── Month nav ───
function updateMonthLabel() {
  const y = currentMonth.getFullYear();
  const m = currentMonth.getMonth()+1;
  document.getElementById('month-label').textContent = `${y}年${m}月`;
}
function changeMonth(delta) {
  currentMonth.setMonth(currentMonth.getMonth() + delta);
  updateMonthLabel();
  renderAll();
}

// ─── User ───
function setUser(el) {
  currentUser = el.dataset.user;
  document.querySelectorAll('.user-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderAll();
}

// ─── Filter ───
function setFilter(el) {
  currentFilter = el.dataset.cat;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderHistory();
}

// ─── Page nav ───
function showPage(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  btn.classList.add('active');
  if (name === 'home') renderHome();
  if (name === 'history') renderHistory();
  if (name === 'stats') renderStats();
}

// ─── Form state ───
let formState = { cat: '食費', who: '啓史', kikae: 'なし' };

function selectCat(el) {
  formState.cat = el.textContent;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}
function selectWho(el) {
  formState.who = el.textContent;
  document.querySelectorAll('.who-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}
function selectKikae(el) {
  formState.kikae = el.textContent;
  document.querySelectorAll('.kikae-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

// ─── Save entry ───
function saveEntry() {
  const memo = document.getElementById('f-memo').value.trim();
  const amount = parseInt(document.getElementById('f-amount').value) || 0;
  const date = document.getElementById('f-date').value;
  if (!memo) { showToast('店名・内容を入力してください'); return; }
  if (!amount) { showToast('金額を入力してください'); return; }
  if (!date) { showToast('日付を選択してください'); return; }

  const entry = {
    id: Date.now(),
    date, memo, amount,
    cat: formState.cat,
    who: formState.who,
    kikae: formState.kikae,
  };
  entries.unshift(entry);
  saveEntries();
  showToast('✓ 記録しました');

  document.getElementById('f-memo').value = '';
  document.getElementById('f-amount').value = '';
  document.querySelectorAll('.form-input').forEach(i => i.classList.remove('ai-fill'));

  const zone = document.getElementById('receipt-zone');
  zone.classList.remove('done');
  document.getElementById('receipt-input').value = '';
}

function deleteEntry(id) {
  entries = entries.filter(e => e.id !== id);
  saveEntries();
  renderHistory();
  showToast('削除しました');
}

// ─── Receipt scan with Claude API ───
async function scanReceipt(input) {
  if (!input.files || !input.files[0]) return;
  const file = input.files[0];
  const zone = document.getElementById('receipt-zone');
  zone.classList.add('scanning');
  zone.classList.remove('done');

  try {
    const base64 = await fileToBase64(file);
    const mediaType = file.type || 'image/jpeg';

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 500,
        messages: [{
          role: 'user',
          content: [
            {
              type: 'image',
              source: { type: 'base64', media_type: mediaType, data: base64 }
            },
            {
              type: 'text',
              text: `このレシートの画像から以下の情報を抽出してください。
必ずJSONのみで返答してください（コードブロック不要）:
{
  "memo": "店名または支出内容（日本語）",
  "amount": 数値（合計金額、円）,
  "cat": "以下のいずれか: 食費 / 日用品 / 交通費 / 教育費 / 交際費 / 公租公課 / 保険 / レジャー / 通信費 / 光熱費 / 医療費 / その他"
}
スーパー・食料品店は食費、ドラッグストアで食品以外は日用品、ガソリンは交通費、病院・薬局は医療費、飲食店はレジャーとして判断してください。`
            }
          ]
        }]
      })
    });

    const data = await response.json();
    const text = data.content?.[0]?.text || '';
    const cleaned = text.replace(/```json?/g,'').replace(/```/g,'').trim();
    const parsed = JSON.parse(cleaned);

    document.getElementById('f-memo').value = parsed.memo || '';
    document.getElementById('f-amount').value = parsed.amount || '';

    // highlight AI-filled fields
    ['f-memo','f-amount'].forEach(id => {
      const el = document.getElementById(id);
      el.classList.add('ai-fill');
      setTimeout(() => el.classList.remove('ai-fill'), 3000);
    });

    // set category
    if (parsed.cat) {
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.textContent === parsed.cat) {
          selectCat(btn);
        }
      });
    }

    zone.classList.remove('scanning');
    zone.classList.add('done');
    showToast('📋 読み取り完了！内容を確認してください');

  } catch(err) {
    zone.classList.remove('scanning');
    showToast('読み取りエラー。手動で入力してください');
    console.error(err);
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ─── Toast ───
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ─── Init ───
function renderAll() {
  renderHome();
}

function init() {
  loadEntries();
  updateMonthLabel();

  // Set today's date
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('f-date').value = today;

  renderAll();
}

init();
</script>
