<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>埋見家 家計簿</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root {
    --primary: #1B5E3B;
    --primary-mid: #2E7D55;
    --primary-light: #E8F5EE;
    --primary-pale: #F2FAF5;
    --accent: #D84E1F;
    --accent-light: #FDEEE8;
    --gold: #B8860B;
    --gold-light: #FFF8E1;
    --text: #1A1A1A;
    --text-mid: #555;
    --text-muted: #888;
    --border: rgba(0,0,0,0.1);
    --border-mid: rgba(0,0,0,0.15);
    --surface: #F7F7F5;
    --card: #FFFFFF;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
    background: var(--surface);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── Header ─── */
  .app-header {
    background: var(--primary);
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,0.2);
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px 10px;
  }
  .app-title {
    font-size: 18px;
    font-weight: 700;
    color: white;
    letter-spacing: 0.03em;
  }
  .month-nav {
    display: flex;
    align-items: center;
    gap: 10px;
    color: white;
  }
  .month-nav button {
    background: rgba(255,255,255,0.18);
    border: none;
    color: white;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .month-nav button:hover { background: rgba(255,255,255,0.3); }
  .month-label { font-size: 14px; font-weight: 500; min-width: 80px; text-align: center; }

  .user-tabs {
    display: flex;
    padding: 0 18px;
  }
  .user-tab {
    flex: 1;
    padding: 8px 0;
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border-bottom: 2.5px solid transparent;
    color: rgba(255,255,255,0.6);
    transition: all 0.2s;
    letter-spacing: 0.04em;
  }
  .user-tab.active {
    color: white;
    border-bottom-color: #7FFFC4;
  }

  /* ─── Bottom Nav ─── */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    background: var(--card);
    border-top: 0.5px solid var(--border);
    display: flex;
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom, 0);
    box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
  }
  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0 8px;
    cursor: pointer;
    color: var(--text-muted);
    font-size: 11px;
    gap: 4px;
    transition: color 0.15s;
    border: none;
    background: none;
  }
  .nav-btn.active { color: var(--primary); }
  .nav-btn svg { width: 22px; height: 22px; }

  /* ─── Pages ─── */
  .page { display: none; padding: 16px 16px 90px; max-width: 480px; margin: 0 auto; }
  .page.active { display: block; }

  /* ─── Summary Cards ─── */
  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .summary-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    border: 0.5px solid var(--border);
  }
  .summary-card.full { grid-column: 1 / -1; }
  .summary-label {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .summary-amount {
    font-size: 22px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: -0.02em;
  }
  .summary-amount.small { font-size: 18px; }
  .summary-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* ─── Category Breakdown ─── */
  .section-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .cat-bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .cat-bar-label { width: 52px; color: var(--text-mid); flex-shrink: 0; font-size: 12px; }
  .cat-bar-track { flex: 1; height: 6px; background: #eee; border-radius: 3px; overflow: hidden; }
  .cat-bar-fill { height: 100%; border-radius: 3px; background: var(--primary-mid); transition: width 0.4s ease; }
  .cat-bar-amount { min-width: 60px; text-align: right; color: var(--text-mid); font-size: 12px; }

  /* ─── Entry List ─── */
  .entry-list { display: flex; flex-direction: column; gap: 8px; }
  .entry-card {
    background: var(--card);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow);
    border: 0.5px solid var(--border);
  }
  .entry-dot {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: var(--primary-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .entry-info { flex: 1; min-width: 0; }
  .entry-name { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry-meta { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .entry-right { text-align: right; flex-shrink: 0; }
  .entry-amount { font-size: 15px; font-weight: 700; color: var(--primary); }
  .entry-cat-pill {
    display: inline-block;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 10px;
    background: var(--primary-light);
    color: var(--primary-mid);
    font-weight: 500;
    margin-top: 2px;
  }
  .entry-cat-pill.leisure { background: var(--gold-light); color: var(--gold); }
  .entry-cat-pill.medical { background: #FFF0F0; color: #C0392B; }

  /* ─── Add Entry Page ─── */
  .receipt-zone {
    background: var(--card);
    border: 2px dashed var(--primary-mid);
    border-radius: var(--radius);
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .receipt-zone:hover { background: var(--primary-pale); }
  .receipt-zone.scanning { border-color: var(--accent); background: var(--accent-light); }
  .receipt-zone.done { border-color: var(--primary); background: var(--primary-pale); border-style: solid; }
  .receipt-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .receipt-icon { font-size: 32px; margin-bottom: 8px; }
  .receipt-main-text { font-size: 15px; font-weight: 500; color: var(--primary); }
  .receipt-sub-text { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .scanning-anim { display: none; }
  .receipt-zone.scanning .scanning-anim { display: block; }
  .receipt-zone.scanning .receipt-default { display: none; }
  @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
  .scanning-text { animation: pulse 1s infinite; color: var(--accent); font-weight: 500; font-size: 14px; }

  .form-section {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
    border: 0.5px solid var(--border);
  }
  .form-row { margin-bottom: 14px; }
  .form-row:last-child { margin-bottom: 0; }
  .form-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    margin-bottom: 6px;
    display: block;
  }
  .form-input {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--border-mid);
    border-radius: var(--radius-sm);
    font-size: 15px;
    color: var(--text);
    background: var(--surface);
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    -webkit-appearance: none;
  }
  .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(27,94,59,0.1); background: white; }
  .amount-row { display: flex; align-items: center; gap: 6px; }
  .yen { font-size: 20px; color: var(--text-muted); font-weight: 500; }
  .amount-input { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; flex: 1; }

  .cat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
  }
  .cat-btn {
    padding: 9px 4px;
    border: 1px solid var(--border-mid);
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 500;
    text-align: center;
    cursor: pointer;
    background: var(--surface);
    color: var(--text-mid);
    transition: all 0.15s;
    font-family: inherit;
  }
  .cat-btn:hover { background: var(--primary-light); border-color: var(--primary-mid); color: var(--primary); }
  .cat-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
    font-weight: 700;
  }

  .who-grid { display: flex; gap: 8px; }
  .who-btn {
    flex: 1; padding: 10px 4px;
    border: 1px solid var(--border-mid);
    border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 500;
    text-align: center; cursor: pointer;
    background: var(--surface); color: var(--text-mid);
    transition: all 0.15s; font-family: inherit;
  }
  .who-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

  .kikae-grid { display: flex; gap: 8px; }
  .kikae-btn {
    flex: 1; padding: 9px 4px;
    border: 1px solid var(--border-mid);
    border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 500;
    text-align: center; cursor: pointer;
    background: var(--surface); color: var(--text-mid);
    transition: all 0.15s; font-family: inherit;
  }
  .kikae-btn.active { background: var(--gold); border-color: var(--gold); color: white; }

  .save-btn {
    width: 100%;
    padding: 16px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.04em;
    transition: all 0.15s;
    box-shadow: 0 4px 16px rgba(27,94,59,0.3);
  }
  .save-btn:hover { background: var(--primary-mid); }
  .save-btn:active { transform: scale(0.98); }

  /* ─── History Page ─── */
  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .filter-chip {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border-mid);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    background: var(--card);
    color: var(--text-mid);
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .filter-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* ─── Toast ─── */
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1A1A1A;
    color: white;
    padding: 12px 22px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: var(--shadow-lg);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ─── AI Result highlight ─── */
  .ai-fill { border-color: var(--primary) !important; background: var(--primary-pale) !important; box-shadow: 0 0 0 3px rgba(27,94,59,0.15) !important; }

  /* Spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { width: 20px; height: 20px; border: 2.5px solid rgba(255,255,255,0.3); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; vertical-align: middle; }

  /* Subtle divider */
  .divider { height: 1px; background: var(--border); margin: 14px 0; }

  .page-spacer { height: 16px; }

  /* Fixed costs badge */
  .fixed-badge {
    display: inline-block; font-size: 10px; background: var(--gold-light);
    color: var(--gold); padding: 2px 7px; border-radius: 10px; font-weight: 500; margin-left: 6px;
  }

  /* Shimmer loading skeleton */
  @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
  .skeleton {
    border-radius: 6px; height: 16px;
    background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
    background-size: 800px 100%;
    animation: shimmer 1.2s infinite;
  }

  /* ─── Stats Page extras ─── */
  .period-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    background: var(--card);
    border-radius: var(--radius-sm);
    padding: 4px;
    border: 0.5px solid var(--border);
  }
  .period-tab {
    flex: 1;
    padding: 8px 0;
    border: none;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    transition: all 0.18s;
  }
  .period-tab.active {
    background: var(--primary);
    color: white;
  }
  .year-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: var(--card);
    border-radius: var(--radius-sm);
    padding: 10px;
    border: 0.5px solid var(--border);
  }
  .year-nav button {
    background: var(--surface);
    border: 0.5px solid var(--border);
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text);
  }
  .year-nav span {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    min-width: 80px;
    text-align: center;
  }

  /* Annual stacked bar chart */
  .annual-bars-wrap {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 180px;
    padding-bottom: 24px;
    position: relative;
  }
  .annual-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    min-width: 36px;
    height: 100%;
    position: relative;
    justify-content: flex-end;
  }
  .annual-bar-stack {
    width: 100%;
    display: flex;
    flex-direction: column-reverse;
    border-radius: 4px 4px 0 0;
    overflow: hidden;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .annual-bar-stack:hover { opacity: 0.85; }
  .annual-bar-seg { width: 100%; transition: height 0.4s ease; }
  .annual-col-label {
    position: absolute;
    bottom: -20px;
    font-size: 10px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .annual-col-amount {
    font-size: 9px;
    color: var(--text-muted);
    margin-bottom: 2px;
    white-space: nowrap;
  }
  .annual-gridline {
    position: absolute;
    left: 0; right: 0;
    border-top: 0.5px dashed var(--border);
    pointer-events: none;
  }
  .annual-gridlabel {
    position: absolute;
    left: 0;
    font-size: 9px;
    color: var(--text-muted);
    transform: translateY(-50%);
  }
  .legend-item {
    display: flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--text-mid);
  }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  /* ─── Fixed Costs editable ─── */
  .fc-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 0; border-bottom: 0.5px solid var(--border);
  }
  .fc-name { flex: 1; font-size: 13px; color: var(--text); }
  .fc-amount { font-size: 13px; font-weight: 500; color: var(--primary); min-width: 70px; text-align: right; }
  .fc-edit-btn {
    padding: 4px 10px; border: 0.5px solid var(--border-mid);
    border-radius: 6px; font-size: 11px; cursor: pointer;
    background: var(--surface); color: var(--text-mid); font-family: inherit;
  }
  .fc-del-btn {
    padding: 4px 8px; border: none; border-radius: 6px;
    font-size: 12px; cursor: pointer;
    background: #FEE2E2; color: #C0392B; font-family: inherit;
  }
  .fc-total-row {
    display: flex; justify-content: space-between;
    padding: 10px 0 8px; font-weight: 700; font-size: 13px;
    color: var(--text); border-top: 1px solid var(--border-mid); margin-top: 4px;
  }
  .fc-apply-btn {
    width: 100%; margin-top: 10px; padding: 13px 0;
    border: none; border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 700; cursor: pointer;
    background: var(--primary); color: white; font-family: inherit;
    box-shadow: 0 2px 8px rgba(27,94,59,0.25);
  }
  .fc-apply-btn:active { transform: scale(0.98); }
  .fc-add-btn {
    width: 100%; margin-top: 8px; padding: 11px 0;
    border: 1.5px dashed var(--primary-mid); border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 500; cursor: pointer;
    background: var(--primary-pale); color: var(--primary); font-family: inherit;
  }

  /* ─── Stats Page ─── */
  .chart-container { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; border: 0.5px solid var(--border); }
  .chart-title { font-size: 13px; font-weight: 700; color: var(--text-mid); margin-bottom: 14px; }
  .bar-chart { display: flex; flex-direction: column; gap: 10px; }

</style>
</head>
<body>

<div class="app-header">
  <div class="header-top">
    <div class="app-title">埋見家 家計簿</div>
    <!-- 同期中インジケーター -->
    <div id="sync-indicator" style="display:none;align-items:center;gap:6px;color:rgba(255,255,255,0.85);font-size:12px;">
      <div style="width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;"></div>
      同期中
    </div>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">&#8249;</button>
      <span class="month-label" id="month-label">—</span>
      <button onclick="changeMonth(1)">&#8250;</button>
    </div>
  </div>
  <div class="user-tabs">
    <div class="user-tab active" data-user="全員" onclick="setUser(this)">全員</div>
    <div class="user-tab" data-user="啓史" onclick="setUser(this)">啓史</div>
    <div class="user-tab" data-user="泉" onclick="setUser(this)">泉</div>
  </div>
</div>

<!-- HOME PAGE -->
<div class="page active" id="page-home">
  <div class="page-spacer"></div>

  <div class="summary-grid">
    <div class="summary-card full">
      <div class="summary-label">TODAY 今月の合計支出</div>
      <div class="summary-amount" id="total-amount">¥0</div>
      <div class="summary-sub" id="total-sub">0件の記録</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">食費</div>
      <div class="summary-amount small" id="stat-食費">¥0</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">日用品</div>
      <div class="summary-amount small" id="stat-日用品">¥0</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">レジャー</div>
      <div class="summary-amount small" id="stat-レジャー">¥0</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">医療費</div>
      <div class="summary-amount small" id="stat-医療費">¥0</div>
    </div>
  </div>

  <div class="section-title">カテゴリ別</div>
  <div class="chart-container">
    <div class="bar-chart" id="cat-bars"></div>
  </div>

  <div class="section-title">最近の記録</div>
  <div class="entry-list" id="recent-entries"></div>
</div>

<!-- ADD PAGE -->
<div class="page" id="page-add">
  <div class="page-spacer"></div>

  <div class="receipt-zone" id="receipt-zone">
    <input type="file" accept="image/*" capture="environment" onchange="scanReceipt(this)" id="receipt-input">

function parseDate(dateStr) {
  if (!dateStr) return { y: 0, m: -1, d: 0 };
  const s = String(dateStr);
  // "YYYY-MM-DD" 形式
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return { y: parseInt(m[1]), m: parseInt(m[2]) - 1, d: parseInt(m[3]) };
  // ISO形式はJSTに変換（+9時間）
  const dt = new Date(s);
  const jst = new Date(dt.getTime() + 9 * 60 * 60 * 1000);
  return { y: jst.getUTCFullYear(), m: jst.getUTCMonth(), d: jst.getUTCDate() };
}

function dateStr(entry) {
  const { m, d } = parseDate(entry.date);
  return `${m + 1}月${d}日`;

function setLoading(on) {
  document.getElementById('sync-indicator').style.display = on ? 'flex' : 'none';
}

async function loadEntries() {
  setLoading(true);
  try {
    const res = await fetch(GAS_URL);
    const data = await res.json();
    if (data.entries) {
      entries = data.entries;
      localStorage.setItem('umeimi_cache', JSON.stringify(entries));
    }
  } catch(e) {
    const cached = localStorage.getItem('umeimi_cache');
    entries = cached ? JSON.parse(cached) : [];
    showToast('オフライン：キャッシュを表示中');
  } finally {
    setLoading(false);
  }
}

async function saveEntries(entry) {
  localStorage.setItem('umeimi_cache', JSON.stringify(entries));
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'add', entry }),
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error);
  } catch(e) {
    showToast('保存エラー。再度お試しください');
    console.error(e);
  }
}

async function deleteEntryRemote(id) {
  localStorage.setItem('umeimi_cache', JSON.stringify(entries));

      body: JSON.stringify({ action: 'delete', id }),
    });
  } catch(e) {
    showToast('削除の同期に失敗しました');
    console.error(e);
  }
}

// ─── Filtering ───
function getFilteredEntries() {
  const y = currentMonth.getFullYear();
  const m = currentMonth.getMonth();
  return entries.filter(e => {
    const ed = parseDate(e.date);
    if (ed.y !== y || ed.m !== m) return false;
    if (currentUser !== '全員' && e.who !== currentUser) return false;
    if (currentFilter !== '全て' && e.cat !== currentFilter) return false;
    return true;
  });
}

// ─── Annual stacked bar chart ───
function renderAnnualChart(fromYear, toYear) {
  const CATS = ['食費','日用品','レジャー','交通費','教育費','医療費','交際費','その他','光熱費','通信費','保険','公租公課','住宅ローン'];

  // Build columns: if single year → 12 months, else → each year
  let cols = [];
  if (fromYear === toYear) {
    // month columns
    for (let m = 0; m < 12; m++) {
      const label = (m+1)+'月';
      const colEntries = entries.filter(e => {
        const d = parseDate(e.date);
        return d.y === fromYear && d.m === m;
      });
      cols.push({ label, entries: colEntries });
    }
  } else {
    // year columns
    for (let y = fromYear; y <= toYear; y++) {
      const colEntries = entries.filter(e => parseDate(e.date).y === y);
      cols.push({ label: y+'年', entries: colEntries });
    }
  }

  // Compute per-col cat totals
  const colData = cols.map(col => {
    const totals = {};
    CATS.forEach(c => totals[c] = 0);
    col.entries.forEach(e => { totals[e.cat] = (totals[e.cat]||0) + e.amount; });
    const total = Object.values(totals).reduce((a,b)=>a+b,0);
    return { label: col.label, totals, total };
  });

  const maxTotal = Math.max(...colData.map(c=>c.total), 1);

  // Which cats actually have data?
  const activeCats = CATS.filter(cat => colData.some(c => c.totals[cat] > 0));

  // Legend
  const legendEl = document.getElementById('annual-legend');
  legendEl.innerHTML = activeCats.map(cat => `
    <div class="legend-item">
      <div class="legend-dot" style="background:${CAT_COLOR[cat]||'#888'}"></div>
      <span>${cat}</span>
    </div>
  `).join('');

  // Chart
  const chartHeight = 160; // px for bars area
  const gridSteps = 4;

  // Grid lines HTML (positioned absolutely inside wrapper)
  let gridHTML = '';
  for (let i = 1; i <= gridSteps; i++) {
    const pct = (i / gridSteps) * 100;
    const bottomPct = 100 - pct;
    const val = Math.round(maxTotal * (i/gridSteps));
    gridHTML += `
      <div class="annual-gridline" style="bottom:${pct}%"></div>
      <div class="annual-gridlabel" style="bottom:${pct}%">${val>=10000?Math.round(val/10000)+'万':val.toLocaleString()}</div>
    `;
  }

  // Bar columns
  const barsHTML = colData.map(col => {
    const barH = maxTotal > 0 ? Math.round((col.total / maxTotal) * chartHeight) : 0;
    let segsHTML = '';
    let accH = 0;
    activeCats.forEach(cat => {
      const v = col.totals[cat] || 0;
      if (v === 0) return;
      const segH = Math.round((v / maxTotal) * chartHeight);
      accH += segH;
      segsHTML += `<div class="annual-bar-seg" style="height:${segH}px;background:${CAT_COLOR[cat]||'#888'};"></div>`;
    });
    const amtLabel = col.total >= 10000 ? Math.round(col.total/10000)+'万' : (col.total > 0 ? col.total.toLocaleString() : '');
    return `
      <div class="annual-col">
        <div class="annual-col-amount">${amtLabel}</div>
        <div class="annual-bar-stack" style="height:${barH}px;" title="${col.label}: ¥${col.total.toLocaleString()}">${segsHTML}</div>
        <div class="annual-col-label">${col.label}</div>
      </div>
    `;
  }).join('');

  document.getElementById('annual-bar-chart').innerHTML = `
    <div class="annual-bars-wrap" style="height:${chartHeight+40}px;position:relative;padding-bottom:28px;padding-left:28px;">
      ${gridHTML}
      <div style="display:flex;align-items:flex-end;gap:5px;height:${chartHeight}px;width:100%;position:relative;z-index:1;">
        ${barsHTML}
      </div>
    </div>
  `;
}

async function saveEntry() {
  const memo = document.getElementById('f-memo').value.trim();
  const amount = parseInt(document.getElementById('f-amount').value) || 0;
  const date = document.getElementById('f-date').value;
  if (!memo) { showToast('店名・内容を入力してください'); return; }
  if (!amount) { showToast('金額を入力してください'); return; }
  if (!date) { showToast('日付を選択してください'); return; }

  const entry = {
    id: Date.now(),
    date, memo, amount,
    cat: formState.cat,
    who: formState.who,
    kikae: formState.kikae,
  };

  // 楽観的UI：先に画面に反映
  entries.unshift(entry);

  document.getElementById('f-memo').value = '';

  const zone = document.getElementById('receipt-zone');
  zone.classList.remove('done');
  document.getElementById('receipt-input').value = '';

  // スプレッドシートに保存
  await saveEntries(entry);
}

// ─── Receipt scan with Claude API ───
async function scanReceipt(input) {
  if (!input.files || !input.files[0]) return;
  const file = input.files[0];
  const zone = document.getElementById('receipt-zone');
  zone.classList.add('scanning');
  zone.classList.remove('done');

  // スキャン中メッセージを更新
  const scanningText = zone.querySelector('.scanning-text');
  if (scanningText) scanningText.textContent = '画像を準備中...';

  try {
    // リサイズ（時間がかかる場合あり）
    const base64 = await fileToBase64(file);
    if (scanningText) scanningText.textContent = 'AIが読み取り中...';

    // リサイズ後は必ずJPEG形式
    const mediaType = 'image/jpeg';

    // タイムアウト60秒
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 60000);

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      signal: controller.signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 500,
        messages: [{
          role: 'user',
          content: [
            {
              type: 'image',
              source: { type: 'base64', media_type: mediaType, data: base64 }
            },
            {
              type: 'text',
              text: `あなたは日本のレシート読み取り専門AIです。
画像から以下の情報を正確に読み取り、必ずJSONのみで返答してください（コードブロック・説明文は一切不要）。

{
  "memo": "店名（レシート上部の店舗名・施設名を優先。例：anabuki PARK、トライアル、コスモス）",
  "amount": 数値のみ（合計金額、税込、円単位。「合計」「お会計」「ご請求額」「利用金額」の行を優先）,
  "cat": "以下のいずれか1つ: 食費 / 日用品 / 交通費 / 教育費 / 交際費 / 公租公課 / 保険 / レジャー / 通信費 / 光熱費 / 医療費 / その他",
  "date": "YYYY-MM-DD形式（レシートの日付。見つからない場合は今日の日付）"
}

【カテゴリ判定ルール】
- スーパー・食料品店・コンビニ（食品購入）→ 食費
- ドラッグストア・ホームセンター（日用品）→ 日用品
- ガソリンスタンド・駐車場・電車・バス・タクシー → 交通費
- 病院・クリニック・薬局・調剤 → 医療費
- レストラン・カフェ・居酒屋・飲食店 → レジャー
- 学校・塾・習い事 → 教育費
- 電気・ガス・水道 → 光熱費
- 携帯・インターネット → 通信費
- 映画・遊園地・旅行・ホテル → レジャー

【重要な読み取りルール】
- 金額は必ず数値のみ（¥マーク・カンマなし）
- 「合計」「お支払い合計」「ご請求金額」「利用金額」を最優先
- 駐車場レシートはP料金・駐車料金の合計金額を読む
- 楽天ペイ・PayPay等の決済金額が明記されていればその金額`
            }
          ]
        }]
      })
    });

    clearTimeout(timeoutId);
    const data = await response.json();
    if (data.error) throw new Error(data.error.message || 'APIエラー');
    const text = data.content?.[0]?.text || '';
    const cleaned = text.replace(/```json?/g,'').replace(/```/g,'').trim();
    const parsed = JSON.parse(cleaned);

    document.getElementById('f-memo').value = parsed.memo || '';
    document.getElementById('f-amount').value = parsed.amount || '';

    // 日付をセット（AIが読み取った場合）
    if (parsed.date && /^\d{4}-\d{2}-\d{2}$/.test(parsed.date)) {
      document.getElementById('f-date').value = parsed.date;
    }

    // highlight AI-filled fields
    ['f-memo','f-amount','f-date'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.classList.add('ai-fill');
        setTimeout(() => el.classList.remove('ai-fill'), 3000);
      }
    });

    // set category
    if (parsed.cat) {
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.textContent === parsed.cat) {
          selectCat(btn);
        }
      });
    }

    zone.classList.remove('scanning');
    zone.classList.add('done');
    showToast('📋 読み取り完了！内容を確認してください');

  } catch(err) {
    zone.classList.remove('scanning');
    if (err.name === 'AbortError') {
      showToast('⏱ タイムアウト。もう一度お試しください');
    } else if (err.message && err.message.includes('API')) {
      showToast('APIエラー。しばらく待ってから再試行してください');
    } else {
      showToast('読み取りできませんでした。手動で入力してください');
    }
    console.error('scanReceipt error:', err);
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        // カメラ撮影画像は大きすぎるのでリサイズ（最大1600px）
        const MAX = 1600;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else       { w = Math.round(w * MAX / h); h = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        // JPEG品質0.85でbase64に変換
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        resolve(dataUrl.split(',')[1]);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ─── Toast ───
function showToast(msg) {

// ─── Fixed Costs CRUD ───
let editingFixedId = null;

function openAddFixed() {
  editingFixedId = null;
  document.getElementById('fixed-modal-title').textContent = '固定費を追加';
  document.getElementById('fixed-name-input').value = '';
  document.getElementById('fixed-amount-input').value = '';
  document.getElementById('fixed-modal').style.display = 'flex';
}

function openEditFixed(id) {
  const fc = FIXED_COSTS.find(f => f.id === id);
  if (!fc) return;
  editingFixedId = id;
  document.getElementById('fixed-modal-title').textContent = '固定費を編集';
  document.getElementById('fixed-name-input').value = fc.name;
  document.getElementById('fixed-amount-input').value = fc.amount || '';
  document.getElementById('fixed-modal').style.display = 'flex';
}

function closeFixedModal() {
  document.getElementById('fixed-modal').style.display = 'none';
  editingFixedId = null;
}

function saveFixed() {
  const name = document.getElementById('fixed-name-input').value.trim();
  const amount = parseInt(document.getElementById('fixed-amount-input').value) || 0;
  if (!name) { showToast('項目名を入力してください'); return; }

  if (editingFixedId !== null) {
    const fc = FIXED_COSTS.find(f => f.id === editingFixedId);
    if (fc) { fc.name = name; fc.amount = amount; }
    showToast('✓ 更新しました');
  } else {
    const newId = Date.now();
    FIXED_COSTS.push({ id: newId, name, amount });
    showToast('✓ 追加しました');
  }
  saveFixedCosts();
  closeFixedModal();
  renderStats();
}

function deleteFixed(id) {
  FIXED_COSTS = FIXED_COSTS.filter(f => f.id !== id);
  saveFixedCosts();
  renderStats();
  showToast('削除しました');
}

// ─── 固定費を今月分に一括入力 ───
// ─── 固定費を今月分に入力 ───
async function applyFixedCostsToMonth() {
  const y = currentMonth.getFullYear();
  const m = currentMonth.getMonth();
  const monthStr = `${y}年${m+1}月`;

  // 対象月に既に固定費が入っているか確認
  const alreadyApplied = entries.some(e => {
    const ed = parseDate(e.date);
    return ed.y === y && ed.m === m && e.cat === '固定費反映済';
  });

  // 対象月の固定費IDを確認（重複防止）
  const existingFixed = new Set(
    entries
      .filter(e => {
        const ed = parseDate(e.date);
        return ed.y === y && ed.m === m && String(e.id).startsWith('fixed_');
      })
      .map(e => String(e.id))
  );

  const targets = FIXED_COSTS.filter(fc => fc.amount > 0);
  if (targets.length === 0) { showToast('金額が設定された固定費がありません'); return; }

  // 既に全部入っているかチェック
  const newTargets = targets.filter(fc => !existingFixed.has(`fixed_${y}${String(m+1).padStart(2,'0')}_${fc.id}`));
  if (newTargets.length === 0) {
    showToast(`${monthStr}の固定費はすでに入力済みです`);
    return;
  }

  const dateStr = `${y}-${String(m+1).padStart(2,'0')}-01`;
  // 固定費のカテゴリを名前から自動判定
  function fcCategory(name) {
    if (name.includes('電気') || name.includes('水道') || name.includes('ガス') || name.includes('光熱')) return '光熱費';
    if (name.includes('保険')) return '保険';
    if (name.includes('スマホ') || name.includes('携帯') || name.includes('Wi-Fi') || name.includes('通信')) return '通信費';
    if (name.includes('月謝') || name.includes('塾') || name.includes('スイミング') || name.includes('教育')) return '教育費';
    if (name.includes('ローン') || name.includes('住宅')) return '住宅ローン';
    if (name.includes('医療') || name.includes('病院')) return '医療費';
    return 'その他';
  }

  setLoading(true);
  let addedCount = 0;
  for (const fc of newTargets) {
    const entry = {
      id: `fixed_${y}${String(m+1).padStart(2,'0')}_${fc.id}`,
      date: dateStr,
      memo: fc.name,
      amount: fc.amount,
      cat: fcCategory(fc.name),
      who: '啓史',
      kikae: 'なし',
    };
    entries.unshift(entry);
    await saveEntries(entry);
    addedCount++;
  }
  setLoading(false);
  renderHome();
  renderStats();
  showToast(`✓ ${monthStr}に固定費${addedCount}件を入力しました`);
}

// ─── 過去データに住宅ローンを一括追加（2024年5月〜） ───
async function addMortgageToHistory() {
  // 2024年5月 〜 現在月の1ヶ月前まで
  const startYear = 2024, startMonth = 5; // 5月=month index 4
  const endDate = new Date(currentMonth);
  endDate.setMonth(endDate.getMonth() - 1);

  let addedCount = 0;
  setLoading(true);

  const cursor = new Date(startYear, startMonth - 1, 1);
  while (cursor <= endDate) {
    const y = cursor.getFullYear();
    const m = cursor.getMonth();
    const id = `fixed_${y}${String(m+1).padStart(2,'0')}_9`; // id:9 = 住宅ローン

    // 既存チェック
    const exists = entries.some(e => String(e.id) === id);
    if (!exists) {
      const entry = {
        id,
        date: `${y}-${String(m+1).padStart(2,'0')}-01`,
        memo: '住宅ローン',
        amount: 60000,
        cat: '住宅ローン',
        who: '啓史',
        kikae: 'なし',
      };
      entries.push(entry);
      await saveEntries(entry);
      addedCount++;
    }
    cursor.setMonth(cursor.getMonth() + 1);
  }

  setLoading(false);
  renderHome();
  renderStats();
  if (addedCount > 0) {
    showToast(`✓ 過去${addedCount}ヶ月分の住宅ローンを追加しました`);
  } else {
    showToast('住宅ローンはすでに追加済みです');
  }
}
